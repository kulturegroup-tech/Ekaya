<style>
:root{
  /* Layout: frosted panes floating over a lit festive night. Material 3 shell (top app bar, nav bar that becomes a rail at 900px, FAB, bottom sheets) rendered in glass. */
  --bg:#F8F2F3;
  --ink:#25121C; --ink-2:#6B5461; --ink-3:#9A8691;
  --rani:#AE2159; --on-rani:#FFFFFF; --rani-soft:rgba(174,33,89,.09); --rani-soft-2:rgba(174,33,89,.15);
  --gold:#9C6A12; --gold-soft:rgba(206,146,36,.16); --gold-glow:rgba(230,160,40,.0);
  --peacock:#13706A; --peacock-soft:rgba(19,112,106,.12);
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.92);
  --sheet:rgba(255,249,251,.93); --field:rgba(255,255,255,.7);
  --line:rgba(80,22,50,.09); --line-2:rgba(80,22,50,.18);
  --shadow:0 22px 44px -26px rgba(110,24,62,.40), 0 2px 8px -3px rgba(110,24,62,.10);
  --fab-shadow:0 14px 30px -12px rgba(174,33,89,.6), 0 3px 8px rgba(60,10,30,.14);
  --orb-a:rgba(247,170,60,.62); --orb-b:rgba(228,72,126,.46); --orb-c:rgba(28,160,140,.30);
  --good:#1B8553; --good-soft:rgba(27,133,83,.12);
  --warn:#A66106; --warn-soft:rgba(200,128,16,.15);
  --bad:#BF2D3A; --bad-soft:rgba(191,45,58,.11); --on-bad:#FFFFFF;
  --inv-bg:#2E1C26; --inv-fg:#FBEFF4;
  --scrim:rgba(40,10,26,.30);
  --cap-bg:rgba(24,8,16,.5); --cap-fg:#FFFFFF;
  --grain-op:.045;
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-ui:"Google Sans Flex","Google Sans","Product Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:26px; --r-tile:18px; --r-field:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140A11;
    --ink:#F8EDF2; --ink-2:#CDB5C1; --ink-3:#93798A;
    --rani:#FF8DB5; --on-rani:#4A0A24; --rani-soft:rgba(255,141,181,.11); --rani-soft-2:rgba(255,141,181,.19);
    --gold:#F3C36B; --gold-soft:rgba(243,195,107,.14); --gold-glow:rgba(243,180,80,.45);
    --peacock:#62D3C2; --peacock-soft:rgba(98,211,194,.13);
    --glass:rgba(44,24,36,.52); --glass-hi:rgba(60,33,48,.74); --glass-edge:rgba(255,255,255,.10);
    --sheet:rgba(32,18,27,.94); --field:rgba(255,255,255,.06);
    --line:rgba(255,220,235,.08); --line-2:rgba(255,220,235,.17);
    --shadow:0 24px 48px -24px rgba(0,0,0,.7), 0 2px 8px -3px rgba(0,0,0,.4);
    --fab-shadow:0 14px 30px -12px rgba(255,120,170,.45), 0 3px 8px rgba(0,0,0,.4);
    --orb-a:rgba(240,160,52,.34); --orb-b:rgba(222,64,124,.34); --orb-c:rgba(24,160,140,.22);
    --good:#63D69E; --good-soft:rgba(99,214,158,.13);
    --warn:#F2B44E; --warn-soft:rgba(242,180,78,.14);
    --bad:#FF8A8F; --bad-soft:rgba(255,138,143,.13); --on-bad:#3D0A0E;
    --inv-bg:#F7E9EF; --inv-fg:#2A1520;
    --scrim:rgba(0,0,0,.5);
    --grain-op:.06;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140A11;
  --ink:#F8EDF2; --ink-2:#CDB5C1; --ink-3:#93798A;
  --rani:#FF8DB5; --on-rani:#4A0A24; --rani-soft:rgba(255,141,181,.11); --rani-soft-2:rgba(255,141,181,.19);
  --gold:#F3C36B; --gold-soft:rgba(243,195,107,.14); --gold-glow:rgba(243,180,80,.45);
  --peacock:#62D3C2; --peacock-soft:rgba(98,211,194,.13);
  --glass:rgba(44,24,36,.52); --glass-hi:rgba(60,33,48,.74); --glass-edge:rgba(255,255,255,.10);
  --sheet:rgba(32,18,27,.94); --field:rgba(255,255,255,.06);
  --line:rgba(255,220,235,.08); --line-2:rgba(255,220,235,.17);
  --shadow:0 24px 48px -24px rgba(0,0,0,.7), 0 2px 8px -3px rgba(0,0,0,.4);
  --fab-shadow:0 14px 30px -12px rgba(255,120,170,.45), 0 3px 8px rgba(0,0,0,.4);
  --orb-a:rgba(240,160,52,.34); --orb-b:rgba(222,64,124,.34); --orb-c:rgba(24,160,140,.22);
  --good:#63D69E; --good-soft:rgba(99,214,158,.13);
  --warn:#F2B44E; --warn-soft:rgba(242,180,78,.14);
  --bad:#FF8A8F; --bad-soft:rgba(255,138,143,.13); --on-bad:#3D0A0E;
  --inv-bg:#F7E9EF; --inv-fg:#2A1520;
  --scrim:rgba(0,0,0,.5);
  --grain-op:.06;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}
.grow{flex:1}

/* Icons */
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;width:1em;height:1em;overflow:hidden;flex:none;user-select:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}

/* Ambient festival light */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%}
.o1{width:70vmax;height:70vmax;left:-24vmax;top:-26vmax;background:radial-gradient(circle,var(--orb-a) 0%,transparent 64%);animation:d1 36s ease-in-out infinite alternate}
.o2{width:62vmax;height:62vmax;right:-26vmax;top:14vh;background:radial-gradient(circle,var(--orb-b) 0%,transparent 64%);animation:d2 44s ease-in-out infinite alternate}
.o3{width:56vmax;height:56vmax;left:4vw;bottom:-32vmax;background:radial-gradient(circle,var(--orb-c) 0%,transparent 64%);animation:d3 52s ease-in-out infinite alternate}
.ambient::after{content:"";position:absolute;inset:0;background-image:var(--grain,none);opacity:var(--grain-op);mix-blend-mode:overlay}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.08)}}
@keyframes d2{to{transform:translate(-10vmax,-6vmax) scale(.94)}}
@keyframes d3{to{transform:translate(12vmax,-8vmax) scale(1.06)}}

/* Glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-edge);border-radius:var(--r-card)}

/* Shell */
#app{position:relative;z-index:1;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid var(--line)}
.topbar .icon-btn:first-child{margin-left:-8px}
.brand{display:flex;align-items:baseline;gap:10px}
.wordmark{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:29px;letter-spacing:-.01em;line-height:1;color:var(--ink)}
.wordmark::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:3px;box-shadow:0 0 12px 3px var(--gold-glow)}
.brand-tag{font:600 10.5px/1 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2)}
.top-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.top-title small{font-family:var(--f-display);font-style:italic;font-size:13px;color:var(--ink-2)}
.top-title b{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:600 12px/1 var(--f-ui);color:var(--ink-2);background:var(--field);border:1px solid var(--line);white-space:nowrap}
.sync .ms{font-size:16px}
.sync.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.enter{animation:rise .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--glass-hi);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border-top:1px solid var(--line)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink-2);font:600 12px/1.2 var(--f-ui);cursor:pointer;padding:0;min-width:0}
.nav-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-item .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s;position:relative}
.nav-item:hover .pill{background:var(--rani-soft)}
.nav-item[aria-current="page"]{color:var(--ink)}
.nav-item[aria-current="page"] .pill{background:var(--rani-soft-2);color:var(--rani)}
@media (min-width:900px){
  .navbar{top:calc(64px + env(safe-area-inset-top,0px));right:auto;width:calc(96px + env(safe-area-inset-left,0px));grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:22px;padding:28px 0 24px env(safe-area-inset-left,0px);border-top:0;border-right:1px solid var(--line);background:var(--glass)}
  body.has-rail main{padding-left:calc(96px + max(28px,env(safe-area-inset-left,0px)));padding-right:max(28px,env(safe-area-inset-right,0px))}
}

.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(96px + env(safe-area-inset-bottom,0px));height:56px;min-width:56px;padding:0 22px 0 18px;border-radius:18px;border:0;background:var(--rani);color:var(--on-rani);display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--f-ui);box-shadow:var(--fab-shadow);cursor:pointer;overflow:hidden}
.fab::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.fab:hover::after{opacity:.08}.fab:active::after{opacity:.14}
body:not(.in-event) .fab{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:max(28px,calc(env(safe-area-inset-right,0px) + 28px))}}

/* Type */
.eyebrow{font:600 11.5px/1.2 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.display{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,8vw,56px);line-height:1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.display em{font-style:italic;color:var(--rani)}
.section-h{font:600 13px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.hint{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--ink);font-size:13.5px}
.hint .ms{color:var(--gold);font-size:20px}
.hint-s{font-size:12.5px;color:var(--ink-3)}

/* Buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;border:0;font:600 14.5px/1 var(--f-ui);letter-spacing:.01em;cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;background:var(--rani);color:var(--on-rani)}
.btn .ms{font-size:20px;margin-left:-4px}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}
.btn:hover::after{opacity:.08}.btn:active::after{opacity:.14}
.btn.tonal{background:var(--rani-soft-2);color:var(--rani)}
.btn.text{background:none;color:var(--rani);padding:0 14px}
.btn.outline{background:none;color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.danger-text{background:none;color:var(--bad);padding:0 14px}
.btn.sm{height:36px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:none;border:0;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:0;transition:opacity .15s}
.icon-btn:hover::after{opacity:.08}

/* Chips & segments */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);font:500 13.5px/1 var(--f-ui);cursor:pointer;white-space:nowrap}
.chip .ms{font-size:18px;margin-left:-4px}
.chip[aria-pressed="true"]{background:var(--rani-soft-2);border-color:transparent;color:var(--rani)}
.type-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 9px;border-radius:9px;background:var(--rani-soft);color:var(--rani);font:600 12.5px/1 var(--f-ui);white-space:nowrap}
.type-chip .ms{font-size:17px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.seg button{flex:1;min-width:0;height:46px;border:0;background:none;color:var(--ink);font:600 14px/1 var(--f-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border-left:1px solid var(--line-2);padding:0 8px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button .ms{font-size:18px}
.seg button small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.seg button[aria-selected="true"]{background:var(--rani-soft-2);color:var(--rani)}
.seg button[aria-selected="true"] small{color:var(--rani)}
.seg.sm button{height:40px;font-size:13.5px}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;margin:0}
.field>span{font:600 12.5px/1.2 var(--f-ui);color:var(--ink-2)}
.input{height:48px;border-radius:var(--r-field);border:1px solid var(--line-2);background:var(--field);color:var(--ink);font:400 16px/1.3 var(--f-ui);padding:0 14px;width:100%;min-width:0}
.input::placeholder{color:var(--ink-3)}
textarea.input{height:auto;min-height:92px;padding:12px 14px;resize:vertical;line-height:1.45}
select.input{appearance:auto}
.input:focus{outline:none;border-color:var(--rani);box-shadow:0 0 0 1px var(--rani)}
.money-in{position:relative}
.money-in::before{content:"₹";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-size:16px;pointer-events:none}
.money-in .input{padding-left:30px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

/* Progress */
.lin{display:flex;gap:4px;height:6px;align-items:center}
.lin .a{height:6px;border-radius:3px;background:var(--rani);width:calc(var(--p) * 1%);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.lin .t{flex:1;height:6px;border-radius:3px;background:var(--rani-soft-2);position:relative}
.lin .t::after{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%;background:var(--rani)}
.lin[data-full] .t,.lin[data-zero] .a{display:none}
.lin.good .a{background:var(--good)} .lin.good .t{background:var(--good-soft)} .lin.good .t::after{background:var(--good)}
.lin.bad .a{background:var(--bad)}
.lin.thin,.lin.thin .a,.lin.thin .t{height:4px}
.lin.thin .t::after{display:none}
.ring-t{stroke:var(--rani-soft-2)} .ring-a{stroke:var(--rani)}
.ring.good .ring-a{stroke:var(--good)} .ring.good .ring-t{stroke:var(--good-soft)}

/* Home */
.hello{display:flex;flex-direction:column;gap:10px;padding:10px 4px 6px}
.hello-sub{margin:0;color:var(--ink-2);font-size:15.5px}
.ev-list{display:flex;flex-direction:column;gap:14px}
.ev-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 18px 24px;width:100%;text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ev-card:hover{transform:translateY(-2px)}
.ev-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:70px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--line)}
.ev-date .d{font-family:var(--f-display);font-size:31px;line-height:1;font-weight:500}
.ev-date .m{font:700 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--rani);margin-top:5px}
.ev-date .ms{color:var(--ink-3)}
.ev-main{min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ev-main h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:25px;line-height:1.08;text-wrap:balance}

const okHex = h => /^#[0-9a-f]{6}$/i.test(h||'') ? h : '#cccccc';
function parseD(s){ if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysUntil(s){ const d=parseD(s); if(!d) return null; const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/864e5); }
function fmtLong(s){ const d=parseD(s); return d ? d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : ''; }
function fmtShort(s){ const d=parseD(s); return d ? d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : ''; }
function fmtTime(t){ if(!t || !/^\d{1,2}:\d{2}/.test(t)) return ''; const [h,m]=t.split(':').map(Number); return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }
function initials(n){ const w=String(n||'?').trim().split(/\s+/); return ((w[0]||'?')[0] + (w.length>1 ? w[w.length-1][0] : '')).toUpperCase(); }
function avc(n){ let h=0; for(const c of String(n)) h=(h*31 + c.charCodeAt(0))>>>0; return 'av'+(h%5); }
function lin(p, cls=''){ const v=Math.max(0, Math.min(100, Math.round(p*100))); return `<div class="lin ${cls}" style="--p:${v}" ${v>=100?'data-full':''} ${v<=0?'data-zero':''} role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><span class="a"></span><span class="t"></span></div>`; }
function ring(p, size=68, sw=7, cls=''){
  const r=(size-sw)/2, c=2*Math.PI*r, v=Math.max(0,Math.min(1,p)), h=size/2;
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}" class="ring-t"/>${v>0?`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-v)).toFixed(2)}" transform="rotate(-90 ${h} ${h})" class="ring-a"/>`:''}</svg>`;
}

/* ---------- store: shared db when available, this browser otherwise ---------- */
const Store = (() => {
  let db = null, mode = 'loading', local = {};
  const LKEY = 'ekaya-store-v1', listeners = new Map(), queues = new Map();
  const colOf = p => { const a=p.split('/'); return [a.slice(0,-1).join('/'), a[a.length-1]]; };
  function rows(col){ return Object.entries(local[col]||{}).map(([id,d]) => ({id, ...d})); }
  function emit(col){ const set=listeners.get(col); if(!set) return; const r=rows(col); set.forEach(cb => queueMicrotask(() => cb(r))); }
  function persist(){ try{ localStorage.setItem(LKEY, JSON.stringify(local)); }catch(e){ const err=new Error('local_full'); err.code='local_full'; throw err; } }
  function merge(a,b){ const o={...a}; for(const k in b){ const v=b[k]; o[k] = (v && typeof v==='object' && !Array.isArray(v) && a[k] && typeof a[k]==='object' && !Array.isArray(a[k])) ? merge(a[k],v) : v; } return o; }
  function q(path, fn){ const next=(queues.get(path)||Promise.resolve()).catch(()=>{}).then(fn); queues.set(path,next); return next; }
  return {
    get mode(){ return mode; },
    init(ns){ if(ns){ db=ns; mode='cloud'; } else { try{ local=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}; }catch(e){ local={}; } mode='local'; } },
    subscribe(col, cb, onErr){
      if(mode==='cloud') return db.collection(col).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), e => onErr && onErr(e));
      if(!listeners.has(col)) listeners.set(col, new Set());
      listeners.get(col).add(cb); queueMicrotask(() => cb(rows(col)));
      return () => listeners.get(col)?.delete(cb);
    },
    set(path, data){ return q(path, async () => { if(mode==='cloud') return db.doc(path).set(data); const [c,id]=colOf(path); (local[c] ||= {})[id]=JSON.parse(JSON.stringify(data)); persist(); emit(c); }); },
    update(path, patch){ return q(path, async () => { if(mode==='cloud') return db.doc(path).update(patch); const [c,id]=colOf(path); if(!local[c]?.[id]) throw Object.assign(new Error('missing'),{code:'invalid_argument'}); local[c][id]=merge(local[c][id], JSON.parse(JSON.stringify(patch))); persist(); emit(c); }); },
    remove(path){ return q(path, async () => { if(mode==='cloud') return db.doc(path).delete(); const [c,id]=colOf(path); if(local[c]) delete local[c][id]; persist(); emit(c); }); }
  };
})();

function writeErr(e){
  const c = e && e.code;
  if(c==='invalid_argument'){ S.canWrite=false; render(); toast('This view can’t save changes. Ask the owner for edit access.'); }
  else if(c==='quota_exceeded') toast('Storage is full. Delete a few old items and try again.');

}

/* ---------- money maths ---------- */
function stats(ev, people, expenses){
  const per = +ev.perHead || 0;
  const ids = new Set(people.map(p => p.id));
  const rows = people.map(p => {
    const paidIn = (p.payments||[]).reduce((a,x) => a + (+x.amount||0), 0);
    const directList = expenses.filter(x => x.paidBy === p.id);
    const direct = directList.reduce((a,x) => a + (+x.amount||0), 0);
    const expected = (p.expected !== null && p.expected !== undefined && p.expected !== '') ? +p.expected : per;
    const contributed = paidIn + direct;
    const due = Math.max(0, expected - contributed);
    const status = expected <= 0 ? (contributed > 0 ? 'paid' : 'none') : contributed >= expected ? 'paid' : contributed > 0 ? 'part' : 'pending';
    return {...p, paidIn, direct, directList, expected, contributed, due, status};
  }).sort((a,b) => String(a.name).localeCompare(String(b.name)));
  const target = rows.reduce((a,r) => a + r.expected, 0);
  const collected = rows.reduce((a,r) => a + r.contributed, 0);
  const potIn = rows.reduce((a,r) => a + r.paidIn, 0);
  const spent = expenses.reduce((a,x) => a + (+x.amount||0), 0);
  const potSpent = expenses.filter(x => !ids.has(x.paidBy)).reduce((a,x) => a + (+x.amount||0), 0);
  const pending = rows.reduce((a,r) => a + r.due, 0);
  const fair = rows.length ? spent / rows.length : 0;
  return {rows, target, collected, potIn, spent, potSpent, inHand:potIn - potSpent, pending,
    pendingCount: rows.filter(r => r.due > 0).length, budget:(+ev.budget || target), fair};
}

let lastKey = '';
function render(){
  const ev = curEv();
  if(S.cur && S.evLoaded && !ev && S.cur !== S.justCreated){ goHome(); return; }
  document.body.classList.toggle('in-event', !!S.cur);
  document.body.classList.toggle('has-rail', !!S.cur);
  renderTop(ev); renderNav(); renderFab(ev);
  let html;
  if(!S.cur) html = homeView();
  else if(!ev) html = `<div class="ev-card glass skel"></div><div class="ev-card glass skel"></div>`;
  else html = ({overview:overviewView, budget:budgetView, mood:moodView, tasks:tasksView}[S.tab] || overviewView)(ev);
  const key = (S.cur||'home') + ':' + S.tab;
  swapView(html, key !== lastKey);
  lastKey = key;
}
function swapView(html, enter){
  const v = $('#view'), a = document.activeElement;
  let keep = null;
  if(a && a.id && v.contains(a)) keep = {id:a.id, val:a.value, s:a.selectionStart, e:a.selectionEnd};
  v.innerHTML = `<div class="wrap${enter?' enter':''}">${html}</div>`;
  if(keep){ const n=document.getElementById(keep.id); if(n){ if(keep.val !== undefined && 'value' in n) n.value = keep.val; n.focus({preventScroll:true}); try{ if(keep.s != null) n.setSelectionRange(keep.s, keep.e); }catch(e){} } }
}

/* Home */
function byDate(a,b){ if(!a.date && !b.date) return (a.createdAt||0)-(b.createdAt||0); if(!a.date) return 1; if(!b.date) return -1; return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }
function whenText(d){ const n=daysUntil(d); return n===0 ? 'is today' : n===1 ? 'is tomorrow' : `is in ${n} days`; }
function greeting(){ const h=new Date().getHours(); return h<5 ? 'Good evening' : h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening'; }
function homeView(){
  const dateLine = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
  if(Store.mode==='loading') return `<section class="hello"><p class="eyebrow">${dateLine}</p><h1 class="display">${greeting()}, <em>Ekta</em></h1><p class="hello-sub">Opening your events…</p></section><div class="ev-list"><div class="ev-card glass skel"></div><div class="ev-card glass skel"></div></div>`;
  const evs = [...S.events].sort(byDate);
  const up = evs.filter(e => !e.date || daysUntil(e.date) >= 0);
  const past = evs.filter(e => e.date && daysUntil(e.date) < 0).reverse();
  const next = up.find(e => e.date);
  const sub = up.length ? `${up.length} ${up.length===1?'event':'events'} in the works${next ? ` · ${esc(next.name)} ${whenText(next.date)}` : ''}` : 'Nothing on the calendar yet.';
  return `<section class="hello"><p class="eyebrow">${dateLine}</p><h1 class="display">${greeting()}, <em>Ekta</em></h1><p class="hello-sub">${sub}</p></section>
    ${up.length ? `<div class="ev-list">${up.map(evCard).join('')}</div>` : homeEmpty()}
    ${past.length ? `<h2 class="section-h">Past events</h2><div class="ev-list">${past.map(evCard).join('')}</div>` : ''}`;
}
function evCard(e){

/* Budget */
function budgetView(ev){
  const st = stats(ev, S.people, S.expenses), hasContri = st.rows.length > 0;
  const p = hasContri ? (st.target ? st.collected/st.target : 0) : (st.budget ? st.spent/st.budget : 0);
  const head = `<section class="money-hero glass">
    <div class="mh-head"><span class="eyebrow">${hasContri ? 'Contri collected' : 'Spent so far'}</span>
      ${S.canWrite ? `<button class="chip" data-act="edit-money">${icon('payments')}${+ev.perHead ? `${inr(ev.perHead)} per head` : 'Set per-head contri'}</button>` : (+ev.perHead ? `<span class="chip">${inr(ev.perHead)} per head</span>` : '')}</div>
    <div class="mh-big"><b>${inr(hasContri ? st.collected : st.spent)}</b><span>${hasContri ? (st.target ? `of ${inr(st.target)} target` : 'set a per-head amount to see the target') : (st.budget ? `of ${inr(st.budget)} budget` : 'no budget set yet')}</span></div>
    ${lin(p, p>=1 && hasContri ? 'good' : (!hasContri && p>1 ? 'bad' : ''))}
    <div class="mh-stats">${hasContri
      ? `<div><span class="lbl">Spent</span><b>${inr(st.spent)}</b><small>${st.budget ? `of ${inr(st.budget)}` : `${S.expenses.length} expenses`}</small></div>
         <div><span class="lbl">In the pot</span><b class="${st.inHand<0?'bad':''}">${inr(st.inHand)}</b><small>${st.inHand<0 ? 'overspent' : 'cash in hand'}</small></div>
         <div><span class="lbl">Pending</span><b class="${st.pending>0?'bad':'good'}">${inr(st.pending)}</b><small>${st.pendingCount ? `${st.pendingCount} ${st.pendingCount===1?'person':'people'}` : 'all settled'}</small></div>`
      : `<div><span class="lbl">Budget</span><b>${st.budget ? inr(st.budget) : '—'}</b><small>planned</small></div>
         <div><span class="lbl">Left</span><b class="${st.budget && st.budget-st.spent<0?'bad':''}">${st.budget ? inr(st.budget-st.spent) : '—'}</b><small>to spend</small></div>
         <div><span class="lbl">Expenses</span><b>${S.expenses.length}</b><small>logged</small></div>`}</div>
    ${hasContri ? `<div class="mh-actions"><button class="btn tonal sm" data-act="group-msg">${icon('chat')}Group update</button>${ev.upi ? `<span class="chip" title="UPI ID">${icon('wallet')}${esc(ev.upi)}</span>` : ''}</div>` : ''}
  </section>`;
  const segs = [['contri','Contri',st.rows.length],['expenses','Expenses',S.expenses.length],['settle','Settle up',null]];
  const seg = `<div class="seg" role="tablist" aria-label="Budget views">${segs.map(([k,l,c]) => `<button role="tab" data-act="seg" data-seg="${k}" aria-selected="${S.seg===k}">${S.seg===k?icon('check'):''}${l}${c!=null ? ` <small>${c}</small>` : ''}</button>`).join('')}</div>`;
  const body = S.seg === 'expenses' ? expensesBlock(ev, st) : S.seg === 'settle' ? settleBlock(ev, st) : contriBlock(ev, st);
  return head + seg + body;
}
function stChip(r){
  if(r.status==='paid') return `<span class="st st-paid">Paid</span>`;
  if(r.status==='part') return `<span class="st st-part">${inr(r.due)} due</span>`;
  if(r.status==='pending') return `<span class="st st-pending">${inr(r.due)} due</span>`;
  return `<span class="st st-none">No share</span>`;
}
function contriBlock(ev, st){
  if(!st.rows.length) return `<section class="empty glass"><span class="empty-ic">${icon('groups')}</span><h3>Who’s chipping in?</h3><p>Add everyone sharing the cost. Then tick off payments as the UPI pings come in.</p>${S.canWrite ? `<button class="btn" data-act="add-people">${icon('person_add')}Add people</button>` : ''}</section>`;
  const f = S.filter;
  const list = st.rows.filter(r => f==='all' ? true : f==='paid' ? r.status==='paid' : r.due > 0);
  return `<section class="list-card glass">
    <div class="lc-head"><div class="t"><b>${st.rows.length} ${st.rows.length===1?'person':'people'}</b><span>${st.rows.filter(r=>r.status==='paid').length} paid in full</span></div>
      <div class="chips">${[['all','All'],['pending','Pending'],['paid','Paid']].map(([k,l]) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>
    ${list.length ? list.map(r => `<button class="row" data-act="person" data-id="${esc(r.id)}">
        <span class="av ${avc(r.name)}">${esc(initials(r.name))}</span>
        <span class="row-main"><b>${esc(r.name)}</b><span class="row-sub">${inr(r.contributed)}${r.expected ? ` of ${inr(r.expected)}` : ''}${r.direct ? ` · ${inr(r.direct)} paid directly` : ''}</span>${r.expected ? lin(r.contributed/r.expected, 'thin' + (r.status==='paid' ? ' good' : '')) : ''}</span>
        ${stChip(r)}</button>`).join('') : `<div class="row" style="cursor:default"><span class="row-main"><span class="row-sub">${f==='paid' ? 'Nobody has paid in full yet.' : 'Everyone has paid. Lovely.'}</span></span></div>`}
  </section>`;
}
function catName(ev, id){ return (ev.categories||[]).find(c => c.id===id)?.name || 'Other'; }
function payerName(id){ const p = S.people.find(x => x.id===id); return p ? `Paid by ${p.name}` : 'From the pot'; }
function expensesBlock(ev, st){
  const cats = ev.categories || [];
  const by = {}; S.expenses.forEach(x => { const k = cats.some(c => c.id===x.category) ? x.category : '_other'; by[k] = (by[k]||0) + (+x.amount||0); });
  const catRows = cats.map(c => ({name:c.name, planned:+c.planned||0, spent:by[c.id]||0})).concat(by._other ? [{name:'Other', planned:0, spent:by._other}] : []);
  const planned = cats.reduce((a,c) => a + (+c.planned||0), 0);
  const catCard = catRows.length ? `<section class="list-card glass">
    <div class="lc-head"><div class="t"><b>By category</b><span>${planned ? `${inr(planned)} planned across ${cats.length}` : 'Add planned amounts to track each one'}</span></div>${S.canWrite ? `<button class="btn text sm" data-act="edit-plan">${icon('edit')}Plan</button>` : ''}</div>
    ${catRows.map(c => { const over = c.planned && c.spent > c.planned; return `<div class="cat"><span class="n">${esc(c.name)}</span><span class="v${over?' over':''}"><b>${inr(c.spent)}</b>${c.planned ? ` / ${inr(c.planned)}` : ''}</span>${c.planned ? lin(c.spent/c.planned, 'thin' + (over ? ' bad' : '')) : lin(0,'thin')}</div>`; }).join('')}
  </section>` : '';
  const xs = [...S.expenses].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  const list = xs.length ? `<section class="list-card glass">
    <div class="lc-head"><div class="t"><b>${xs.length} ${xs.length===1?'expense':'expenses'}</b><span>${inr(st.spent)} spent · ${inr(st.potSpent)} from the pot</span></div></div>
    ${xs.map(x => `<button class="row" data-act="expense" data-id="${esc(x.id)}"><span class="row-ic">${icon('receipt_long')}</span>
      <span class="row-main"><b>${esc(x.title || 'Expense')}</b><span class="row-sub">${esc([catName(ev,x.category), payerName(x.paidBy), x.vendor, fmtShort(x.date)].filter(Boolean).join(' · '))}</span></span>
      <span class="row-amt">${inr(x.amount)}</span></button>`).join('')}
  </section>` : `<section class="empty glass"><span class="empty-ic">${icon('receipt_long')}</span><h3>No expenses yet</h3><p>Log each bill as you go: decorator, mithai, drinks. If a friend pays for something directly, it counts towards their contri.</p>${S.canWrite ? `<button class="btn" data-act="add-expense">${icon('add')}Add expense</button>` : ''}</section>`;
  return catCard + list;
}
function settleBlock(ev, st){
  if(!st.rows.length) return `<section class="empty glass"><span class="empty-ic">${icon('groups')}</span><h3>Nobody to split with yet</h3><p>Add the people sharing the cost under Contri first.</p></section>`;
  if(!st.spent) return `<section class="empty glass"><span class="empty-ic">${icon('savings')}</span><h3>Nothing spent yet</h3><p>Once expenses are in, this splits the actual spend equally and shows who gets money back and who still owes.</p></section>`;
  const rows = st.rows.map(r => ({...r, bal: Math.round(r.contributed - st.fair)}));
  return `<section class="glass settle-eq" aria-label="Split calculation">
      <div><b>${inr(st.spent)}</b><span>spent</span></div><span class="op">÷</span>
      <div><b>${rows.length}</b><span>people</span></div><span class="op">=</span>
      <div><b>${inr(st.fair)}</b><span>each</span></div></section>
    <section class="list-card glass">
      <div class="lc-head"><div class="t"><b>Final split</b><span>Based on what each person actually put in</span></div></div>
      ${rows.map(r => `<div class="row" style="cursor:default"><span class="av ${avc(r.name)}">${esc(initials(r.name))}</span>
        <span class="row-main"><b>${esc(r.name)}</b><span class="row-sub">Put in ${inr(r.contributed)}</span></span>
        ${Math.abs(r.bal) < 1 ? `<span class="st st-none">Settled</span>` : r.bal > 0 ? `<span class="st st-paid">Gets back ${inr(r.bal)}</span>` : `<span class="st st-pending">Owes ${inr(-r.bal)}</span>`}</div>`).join('')}
      <div class="lc-foot"><span class="muted">In the pot: <b class="num" style="color:var(--ink)">${inr(st.inHand)}</b></span><button class="btn tonal sm" data-act="settle-msg">${icon('content_copy')}Share split</button></div>
    </section>`;
}

function moodView(ev){

function tile(m){

  if(m.kind === 'color') return `<button class="tile color" data-act="mood" data-id="${id}"><div class="sw" style="--c:${okHex(m.hex)}"></div><div class="meta"><b>${esc(m.label || 'Colour')}</b><span>${esc(okHex(m.hex))}</span></div></button>`;
  return `<button class="tile note" data-act="mood" data-id="${id}">${icon('format_quote')}<p>${esc(m.text)}</p>${m.tag ? `<span class="tag">${esc(m.tag)}</span>` : ''}</button>`;
}

/* Checklist */
function taskSort(a,b){ return (a.order ?? 1e9) - (b.order ?? 1e9) || (a.createdAt||0) - (b.createdAt||0); }
function dueChip(t){
  if(!t.due) return '';
  const n = daysUntil(t.due), cls = t.done ? '' : n < 0 ? 'late' : n <= 2 ? 'soon' : '';
  return `<span class="due ${cls}">${n===0 && !t.done ? 'Today' : fmtShort(t.due)}</span>`;
}
function taskRow(t){
  return `<div class="task${t.done?' done':''}">
    <button class="cb${t.done?' on':''}" data-act="toggle-task" data-id="${esc(t.id)}" aria-pressed="${!!t.done}" aria-label="${t.done?'Mark as not done':'Mark as done'}: ${esc(t.text)}" ${S.canWrite?'':'disabled'}><i>${icon('check')}</i></button>
    <button class="task-text" data-act="task" data-id="${esc(t.id)}"><span>${esc(t.text)}</span>${dueChip(t)}</button></div>`;
}
function tasksView(ev){
  const open = S.tasks.filter(t => !t.done).sort(taskSort);
  const done = S.tasks.filter(t => t.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));
  const total = S.tasks.length, p = total ? done.length/total : 0;
  return `<section class="tasks-head glass"><div class="ring-wrap">${ring(p, 64, 7, total && !open.length ? 'good' : '')}<b>${Math.round(p*100)}%</b></div>
      <div class="t"><b>${total ? `${done.length} of ${total} done` : 'No tasks yet'}</b><span>${open[0] ? `Next: ${esc(open[0].text)}` : total ? 'Everything is ticked off.' : 'Add the first thing to sort out.'}</span></div></section>
    ${S.canWrite ? `<form class="add-task glass" id="addTask" autocomplete="off"><input class="input" id="taskText" placeholder="Add a task" maxlength="140" aria-label="New task"><input class="input" type="date" id="taskDue" aria-label="Due date (optional)"><button class="add-btn" type="submit" aria-label="Add task">${icon('add')}</button></form>` : ''}
    ${open.length ? `<section class="list-card glass">${open.map(taskRow).join('')}</section>` : (total ? '' : '')}
    ${done.length ? `<button class="done-toggle" data-act="done-toggle" aria-expanded="${S.doneOpen}">${icon(S.doneOpen ? 'check_circle' : 'task_alt')}Done · ${done.length}</button>${S.doneOpen ? `<section class="list-card glass">${done.map(taskRow).join('')}</section>` : ''}` : ''}`;
}

/* ---------- sheets ---------- */
let sheetCtx = null, lastFocus = null;
function openSheet({title, body, mount, refresh}){
  lastFocus = document.activeElement;
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${icon('close')}</button></div><div class="sheet-body">${body}</div>`;
  sh.setAttribute('aria-labelledby','sheetTitle');
  sh.hidden = false; $('#scrim').hidden = false; document.body.classList.add('sheet-open');
  const b = $('.sheet-body', sh);
  sheetCtx = {refresh, body:b};
  mount && mount(b);
  const af = $('[data-autofocus]', b);
  (af || $('.icon-btn', sh)).focus({preventScroll:true});
}
function closeSheet(){
  const sh = $('#sheet'); if(sh.hidden) return;
  sh.hidden = true; sh.innerHTML = ''; $('#scrim').hidden = true; document.body.classList.remove('sheet-open'); sheetCtx = null;
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
function refreshSheet(){ if(sheetCtx && sheetCtx.refresh) sheetCtx.refresh(sheetCtx.body); }
const val = (b, sel) => ($(sel, b)?.value ?? '').trim();

function eventSheet(ev, presetType){
  const isNew = !ev; let type = ev ? ev.type : (presetType || 'diwali');
  const body = `
    <label class="field"><span>Event name</span><input class="input" id="f-name" maxlength="80" value="${esc(ev ? ev.name : TYPES[type].name)}" ${isNew?'data-autofocus':''}></label>
    <div class="field"><span>Type</span><div class="chips" id="f-type">${Object.entries(TYPES).map(([k,t]) => `<button type="button" class="chip" data-type="${k}" aria-pressed="${k===type}">${icon(t.icon)}${t.label}</button>`).join('')}</div></div>
    <div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="f-date" value="${esc(ev?.date||'')}"></label><label class="field"><span>Time</span><input class="input" type="time" id="f-time" value="${esc(ev?.time||'')}"></label></div>
    <label class="field"><span>Venue</span><input class="input" id="f-venue" maxlength="120" placeholder="Home, banquet, farmhouse…" value="${esc(ev?.venue||'')}"></label>
    <div class="grid2"><label class="field"><span>Guests</span><input class="input" type="number" inputmode="numeric" min="0" id="f-guests" value="${ev?.guests||''}"></label>
      <label class="field"><span>Total budget</span><div class="money-in"><input class="input" type="number" inputmode="numeric" min="0" id="f-budget" value="${ev?.budget||''}" placeholder="Optional"></div></label></div>
    <div class="grid2"><label class="field"><span>Contri per head</span><div class="money-in"><input class="input" type="number" inputmode="numeric" min="0" id="f-per" value="${ev?.perHead||''}" placeholder="Optional"></div></label>
      <label class="field"><span>UPI ID for contri</span><input class="input" id="f-upi" maxlength="80" autocapitalize="off" spellcheck="false" placeholder="name@okaxis" value="${esc(ev?.upi||'')}"></label></div>
    ${isNew ? `<p class="hint">${icon('auto_awesome')}<span>Starts with a checklist, budget categories and a theme palette for this type. Change anything later.</span></p>` : ''}
    <div class="sheet-foot" id="f-foot">${ev ? `<button class="btn danger-text" type="button" id="f-del">${icon('delete')}Delete</button><span class="grow"></span>` : ''}<button class="btn outline" type="button" data-act="close-sheet">Cancel</button><button class="btn" type="button" id="f-save">${isNew ? 'Create event' : 'Save'}</button></div>`;
  openSheet({title: isNew ? 'New event' : 'Event details', body, mount: b => {
    $('#f-type', b).addEventListener('click', e => {
      const c = e.target.closest('[data-type]'); if(!c) return;
      const prev = type; type = c.dataset.type;
      $$('#f-type .chip', b).forEach(x => x.setAttribute('aria-pressed', x.dataset.type === type));
      const nm = $('#f-name', b); if(isNew && (!nm.value.trim() || nm.value === TYPES[prev].name)) nm.value = TYPES[type].name;
    });
    $('#f-save', b).addEventListener('click', async () => {
      const name = val(b,'#f-name'); if(!name){ $('#f-name', b).focus(); toast('Give the event a name.'); return; }
      const f = {name, date:val(b,'#f-date'), time:val(b,'#f-time'), venue:val(b,'#f-venue'), guests:num(val(b,'#f-guests')), budget:num(val(b,'#f-budget')), perHead:num(val(b,'#f-per')), upi:val(b,'#f-upi')};
      $('#f-save', b).disabled = true;
      if(isNew){ closeSheet(); await createEvent(type, f); }
      else { const ok = await save(Store.update(`events/${ev.id}`, {...f, type})); if(ok){ closeSheet(); toast('Event updated'); } else $('#f-save', b).disabled = false; }
    });
    if(ev) $('#f-del', b).addEventListener('click', () => {
      const foot = $('#f-foot', b);
      foot.outerHTML = `<div class="confirm" id="f-foot"><p>Delete “${esc(ev.name)}” with its budget, mood board and checklist? This can’t be undone.</p><div class="sheet-foot"><button class="btn outline" type="button" id="f-keep">Keep it</button><button class="btn danger" type="button" id="f-yes">Delete event</button></div></div>`;
      $('#f-keep', b).addEventListener('click', () => { closeSheet(); eventSheet(curEv()); });
      $('#f-yes', b).addEventListener('click', () => { closeSheet(); deleteEvent(ev); });
    });
  }});
}
async function createEvent(type, f){
  const id = slug(f.name).slice(0,28) + '-' + uid().slice(-5);
  const now = Date.now();
  S.justCreated = id;
  const ok = await save(Store.set(`events/${id}`, eventFromTemplate(type, {...f, createdAt:now})));
  if(!ok){ S.justCreated = null; return; }
  openEvent(id, 'overview');
  toast(`${f.name} is ready`);

async function deleteEvent(ev){
  const id = ev.id;
  const subs = {people:S.people, expenses:S.expenses, mood:S.mood, tasks:S.tasks};
  goHome();
  for(const [k, list] of Object.entries(subs)){
    for(const d of list){
      if(k==='mood' && d.asset && S.assets){ try{ await S.assets.delete(d.asset); }catch(e){} }
      await save(Store.remove(`events/${id}/${k}/${d.id}`));
    }
  }
  if(await save(Store.remove(`events/${id}`))) toast(`${ev.name} deleted`);
}

function reminderText(ev, r){
  return `Hi ${r.name.split(' ')[0]}! Gentle reminder for the ${ev.name} contri: ${inr(r.due)} pending${r.contributed ? ` (${inr(r.contributed)} received, thank you)` : ''}.${ev.upi ? `\nUPI: ${ev.upi}` : ''}\nThank you!`;
}
function groupText(ev, st){
  const mark = ev.type==='diwali' ? '🪔' : '✨';
  const pend = st.rows.filter(r => r.due > 0);
  return [`${mark} ${ev.name} · contri update`, ev.date ? fmtLong(ev.date) : '', '',
    `${+ev.perHead ? `Per head: ${inr(ev.perHead)} · ` : ''}${st.rows.length} people`,
    `Collected: ${inr(st.collected)}${st.target ? ` of ${inr(st.target)}` : ''}`,
    pend.length ? `\nStill pending:\n${pend.map(r => `• ${r.name}: ${inr(r.due)}`).join('\n')}` : '\nEveryone has paid. Thank you all!',
    ev.upi ? `\nPay to UPI: ${ev.upi}` : ''].filter((l,i) => l !== '' || i === 2).join('\n').replace(/\n{3,}/g,'\n\n');
}
function settleText(ev, st){
  const rows = st.rows.map(r => ({...r, bal:Math.round(r.contributed - st.fair)}));
  const back = rows.filter(r => r.bal >= 1), owe = rows.filter(r => r.bal <= -1);
  return [`${ev.name} · final split`, `Total spent ${inr(st.spent)} ÷ ${rows.length} = ${inr(st.fair)} each`, '',
    owe.length ? `To pay:\n${owe.map(r => `• ${r.name}: ${inr(-r.bal)}`).join('\n')}` : 'Nobody owes anything.',
    back.length ? `\nGets back:\n${back.map(r => `• ${r.name}: ${inr(r.bal)}`).join('\n')}` : '',
    ev.upi && owe.length ? `\nUPI: ${ev.upi}` : ''].filter(Boolean).join('\n');
}

    $('#n-save', b).addEventListener('click', async () => {
      const text = val(b,'#n-text'); if(!text){ toast('Write the note first.'); return; }
      if(await save(Store.set(evPath('mood', m ? m.id : 'm' + uid()), {kind:'note', text, tag:val(b,'#n-tag'), createdAt:m?.createdAt || Date.now()}))){ closeSheet(); toast(m ? 'Note saved' : 'Note added to the board'); }
    });
    if(m) $('#n-del', b).addEventListener('click', () => deleteMood(m));
  }});
}
function colorSheet(m){
  openSheet({title: m ? 'Colour' : 'Add a colour', body:`
    <div class="mi-color" id="c-prev" style="--c:${okHex(m?.hex || '#D9A441')}"></div>
    <div class="pal-row"><input type="color" id="c-hex" value="${okHex(m?.hex || '#D9A441')}" aria-label="Pick a colour"><input class="input" id="c-name" maxlength="30" placeholder="Name it: Haldi, Rani pink…" value="${esc(m?.label||'')}" aria-label="Colour name"></div>
    <div class="sheet-foot">${m ? `<button class="btn danger-text" type="button" id="c-del">${icon('delete')}Delete</button><span class="grow"></span>` : ''}<button class="btn outline" type="button" data-act="close-sheet">Cancel</button><button class="btn" type="button" id="c-save">${m ? 'Save' : 'Add colour'}</button></div>`,
  mount: b => {
    $('#c-hex', b).addEventListener('input', e => $('#c-prev', b).style.setProperty('--c', e.target.value));
    $('#c-save', b).addEventListener('click', async () => {
      if(await save(Store.set(evPath('mood', m ? m.id : 'm' + uid()), {kind:'color', hex:okHex($('#c-hex', b).value).toUpperCase(), label:val(b,'#c-name'), createdAt:m?.createdAt || Date.now()}))){ closeSheet(); toast(m ? 'Colour saved' : 'Colour added to the board'); }
    });
    if(m) $('#c-del', b).addEventListener('click', () => deleteMood(m));
  }});
}
function photoSheet(m){
  openSheet({title:'Photo', body:`<img class="mi-img" src="${esc(imgSrc(m))}" alt="${esc(m.caption||'Mood board photo')}">
    ${S.canWrite ? `<label class="field"><span>Caption</span><input class="input" id="ph-cap" maxlength="60" placeholder="Entrance décor, mehendi outfit…" value="${esc(m.caption||'')}"></label>
    <div class="sheet-foot"><button class="btn danger-text" type="button" id="ph-del">${icon('delete')}Delete</button><span class="grow"></span><button class="btn outline" type="button" data-act="close-sheet">Cancel</button><button class="btn" type="button" id="ph-save">Save</button></div>` : (m.caption ? `<p style="margin:0">${esc(m.caption)}</p>` : '')}`,
  mount: b => {
    if(!S.canWrite) return;
    $('#ph-save', b).addEventListener('click', async () => { if(await save(Store.update(evPath('mood', m.id), {caption:val(b,'#ph-cap')}))){ closeSheet(); toast('Caption saved'); } });
    $('#ph-del', b).addEventListener('click', () => deleteMood(m));
  }});
}
async function deleteMood(m){
  if(await save(Store.remove(evPath('mood', m.id)))){
    if(m.asset && S.assets){ try{ await S.assets.delete(m.asset); }catch(e){} }
    closeSheet(); toast('Removed from the board');
  }
}
function taskSheet(t){
  if(!S.canWrite) return;
  openSheet({title:'Task', body:`
    <label class="field"><span>Task</span><textarea class="input" id="tk-text" maxlength="140" style="min-height:72px">${esc(t.text)}</textarea></label>
    <label class="field"><span>Due date</span><input class="input" type="date" id="tk-due" value="${esc(t.due||'')}"></label>
    <div class="sheet-foot"><button class="btn danger-text" type="button" id="tk-del">${icon('delete')}Delete</button><span class="grow"></span><button class="btn outline" type="button" data-act="close-sheet">Cancel</button><button class="btn" type="button" id="tk-save">Save</button></div>`,
  mount: b => {
    $('#tk-save', b).addEventListener('click', async () => { const text = val(b,'#tk-text'); if(!text) return; if(await save(Store.update(evPath('tasks', t.id), {text, due:val(b,'#tk-due')}))){ closeSheet(); toast('Task saved'); } });
    $('#tk-del', b).addEventListener('click', async () => { if(await save(Store.remove(evPath('tasks', t.id)))){ closeSheet(); toast('Task deleted'); } });
  }});
}

/* ---------- photos ---------- */
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); }; im.src = u; }); }
async function scaled(file, max){
  const im = await loadImg(file), w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
  const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
  URL.revokeObjectURL(im.src); return c;
}
const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
function assetErr(e){
  const c = e && e.code;
  return c==='too_large' ? 'That photo is too large. Try one under 20 MB.' : c==='unsupported_type' ? 'Use a JPG, PNG, WebP or GIF image.' : c==='quota_or_state' ? 'Photo storage is full. Remove a few photos and try again.' : c==='rate_limited' ? 'Too many uploads at once. Wait a moment and try again.' : c==='decode' ? 'That image couldn’t be read. Try a JPG or PNG.' : null;
}
async function addPhotos(files){
  files = [...files].filter(f => f.type.startsWith('image/'));
  if(!files.length || !S.cur || !S.canWrite) return;
  toast(`Adding ${files.length} ${files.length===1?'photo':'photos'}…`);
  let ok = 0;
  for(const f of files){
    try{
      const item = {kind:'image', caption:'', createdAt:Date.now()};
      if(S.assets){
        let blob = f;
        if(f.size > 2.5e6 || !/^image\/(png|jpeg|gif|webp)$/.test(f.type)) blob = await toBlob(await scaled(f, 2000), .86);
        const r = await S.assets.upload(blob, {type: blob.type || 'image/jpeg'});
        item.asset = r.id;
      } else {
        const cloud = Store.mode === 'cloud';
        let d = (await scaled(f, cloud ? 1100 : 820)).toDataURL('image/jpeg', cloud ? .74 : .66);
        if(d.length > 230000) d = (await scaled(f, 680)).toDataURL('image/jpeg', .6);
        item.src = d;
      }
      if(await save(Store.set(evPath('mood', 'm' + uid()), item))) ok++; else break;
    }catch(e){ console.warn(e); const msg = assetErr(e.code ? e : {code:e.message}); toast(msg || 'Couldn’t add that photo. Try again.'); }
  }
  if(ok) toast(ok === 1 ? 'Photo added to the board' : `${ok} photos added to the board`);
}

/* ---------- navigation & data ---------- */
let subUnsubs = [];
function stopEventSubs(){ subUnsubs.forEach(u => { try{ u(); }catch(e){} }); subUnsubs = []; }
function openEvent(id, tab){
  if(S.cur !== id || !subUnsubs.length){
    stopEventSubs(); S.cur = id; S.people = []; S.expenses = []; S.mood = []; S.tasks = []; S.loaded = {}; S.filter = 'all';
    ['people','expenses','mood','tasks'].forEach(k => subUnsubs.push(Store.subscribe(`events/${id}/${k}`, rows => { if(S.cur !== id) return; S[k] = rows; S.loaded[k] = true; render(); refreshSheet(); }, onSubErr)));
  }
  if(tab) S.tab = tab;
  saveNav(); render(); window.scrollTo(0,0);
}
function goHome(){ stopEventSubs(); S.cur = null; S.people = []; S.expenses = []; S.mood = []; S.tasks = []; closeSheet(); saveNav(); render(); window.scrollTo(0,0); }
function onSubErr(e){ console.warn(e); if(e && e.code === 'revoked'){ S.canWrite = false; toast('Access to this page changed. Reload to continue.'); render(); } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, id = t.dataset.id, ev = curEv();
  switch(act){
    case 'close-sheet': closeSheet(); break;
    case 'home': goHome(); break;
    case 'open-event': openEvent(id, 'overview'); break;
    case 'new-event': if(S.canWrite) eventSheet(null, t.dataset.type); break;
    case 'edit-event': if(ev && S.canWrite) eventSheet(ev); break;
    case 'tab': S.tab = t.dataset.tab; saveNav(); render(); window.scrollTo(0,0); break;
    case 'seg': S.seg = t.dataset.seg; saveNav(); render(); break;
    case 'filter': S.filter = t.dataset.f; render(); break;
    case 'edit-money': if(ev && S.canWrite) moneySheet(ev); break;
    case 'add-people': if(ev && S.canWrite) addPeopleSheet(ev); break;
    case 'person': personSheet(id); break;
    case 'add-expense': if(ev && S.canWrite) expenseSheet(ev); break;
    case 'expense': { const x = S.expenses.find(y => y.id === id); if(ev && x && S.canWrite) expenseSheet(ev, x); break; }
    case 'edit-plan': if(ev && S.canWrite) planSheet(ev); break;
    case 'group-msg': if(ev) messageSheet('Group update', groupText(ev, stats(ev, S.people, S.expenses))); break;
    case 'settle-msg': if(ev) messageSheet('Final split', settleText(ev, stats(ev, S.people, S.expenses))); break;
    case 'edit-theme': if(ev && S.canWrite) themeSheet(ev); break;
    case 'add-mood': if(S.canWrite) addMoodSheet(); break;
    case 'mood': { const m = S.mood.find(y => y.id === id); if(!m) break; if(m.kind==='image') photoSheet(m); else if(S.canWrite) (m.kind==='color' ? colorSheet : noteSheet)(m); break; }
    case 'toggle-task': { const k = S.tasks.find(y => y.id === id); if(k && S.canWrite) save(Store.update(evPath('tasks', id), {done:!k.done, doneAt: k.done ? 0 : Date.now()})); break; }
    case 'task': { const k = S.tasks.find(y => y.id === id); if(k) taskSheet(k); break; }
    case 'done-toggle': S.doneOpen = !S.doneOpen; render(); break;
  }
});
document.addEventListener('submit', async e => {
  if(e.target.id !== 'addTask') return;
  e.preventDefault();
  const tx = $('#taskText'), du = $('#taskDue'), text = tx.value.trim(); if(!text || !S.cur) return;
  const order = S.tasks.reduce((a,t) => Math.max(a, +t.order || 0), 0) + 1;
  tx.value = ''; const due = du.value; du.value = '';
  if(!(await save(Store.set(evPath('tasks', 't' + uid()), {text, done:false, due, order, createdAt:Date.now()})))) tx.value = text;
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
$('#filePick').addEventListener('change', e => { const f = e.target.files; addPhotos(f).finally(() => { e.target.value = ''; }); });
document.addEventListener('error', e => { const im = e.target; if(im && im.tagName === 'IMG'){ const tl = im.closest('.tile'); if(tl) tl.classList.add('broken'); else im.style.visibility = 'hidden'; } }, true);
document.addEventListener('paste', e => {
  if(S.tab !== 'mood' || !S.cur || !S.canWrite || !$('#sheet').hidden) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); addPhotos(files); }
});
['dragover','dragleave','drop'].forEach(type => document.addEventListener(type, e => {
  if(S.tab !== 'mood' || !S.cur || !S.canWrite) return;
  const board = $('#board'); if(!board) return;
  if(type === 'dragover'){ if([...(e.dataTransfer?.types||[])].includes('Files')){ e.preventDefault(); board.classList.add('board-drop'); } }
  else { board.classList.remove('board-drop'); if(type === 'drop' && e.dataTransfer?.files?.length){ e.preventDefault(); addPhotos(e.dataTransfer.files); } }
}));

/* grain texture */
try{ const c = document.createElement('canvas'); c.width = c.height = 140; const x = c.getContext('2d'), im = x.createImageData(140,140);
  for(let i = 0; i < im.data.length; i += 4){ const v = Math.random()*255|0; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
  x.putImageData(im, 0, 0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`); }catch(e){}

/* ---------- boot ---------- */
async function boot(){
  render();
  let db = null, user = null, assets = null;
  if(window.claude && typeof window.claude.use === 'function'){
    try{ [db, user, assets] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets')]); }catch(e){ console.warn(e); }
  }
  Store.init(db);
  S.assets = assets;
  if(db){ let can = null; try{ can = user ? await user.can('data.write') : null; }catch(e){} S.canWrite = can !== false; }
  else {
    let seeded = true; try{ seeded = !!localStorage.getItem('ekaya-seeded-v1'); }catch(e){}
    if(!seeded && today() <= '2026-11-08'){
      try{
        localStorage.setItem('ekaya-seeded-v1', '1');
        const now = Date.now();
        await Store.set('events/diwali-party', eventFromTemplate('diwali', {name:'Diwali Party', date:'2026-11-08', createdAt:now}));
        for(const t of tasksFromTemplate('diwali', now)) await Store.set(`events/diwali-party/tasks/${t.id}`, t.data);
      }catch(e){ console.warn(e); }
    }
  }
  Store.subscribe('events', rows => { S.events = rows; S.evLoaded = true; if(S.justCreated && rows.some(r => r.id === S.justCreated)) S.justCreated = null; render(); refreshSheet(); }, onSubErr);
  const nav = loadNav();
  if(nav && nav.cur){ S.seg = nav.seg || 'contri'; openEvent(nav.cur, nav.tab || 'overview'); }
  else render();
}
boot();
})();
</script>
