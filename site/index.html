<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

  <linearGradient id="foilH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8914C" stop-opacity="0"/><stop offset=".5" stop-color="#C9A45C"/><stop offset="1" stop-color="#B8914C" stop-opacity="0"/></linearGradient>
  <radialGradient id="vzg-light"><stop offset="0" stop-color="var(--c-light)" stop-opacity=".75"/><stop offset="1" stop-color="var(--c-light)" stop-opacity="0"/></radialGradient>
  <radialGradient id="vzg-fire"><stop offset="0" stop-color="var(--c-fire)" stop-opacity=".8"/><stop offset=".55" stop-color="var(--c-light)" stop-opacity=".3"/><stop offset="1" stop-color="var(--c-light)" stop-opacity="0"/></radialGradient>
</defs></svg>
<div class="ambient" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

  <nav class="dock" id="dock" aria-label="Event sections" hidden></nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
