<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Wall · Ekāya Events</title>
<meta name="description" content="Add your photos and see everyone’s from the celebration.">
<meta name="theme-color" content="#F6F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0A0C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .gw{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right,0px)) 80px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
  .g-head{position:relative;overflow:hidden;padding:30px 24px 34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
  .g-head .display{font-size:clamp(44px,11vw,76px)}
  .g-head .strip{height:6px}
  .g-logo{display:flex;justify-content:center;padding:6px 0 2px}
  .g-foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin:28px 0 8px;color:var(--brand);font:600 10px/1 var(--f-ui);letter-spacing:.3em;text-transform:uppercase}
  .g-foot svg{width:22px;height:33px;fill:currentColor}
  .g-up{padding:20px;display:flex;flex-direction:column;gap:14px}
  .g-up .btn{height:58px;font-size:16px}
  .g-prog{display:flex;flex-direction:column;gap:8px}
  .g-prog .row{padding:10px 0;border-top:0}
  .g-retry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);font-size:14px}
  .g-retry .ms{color:var(--warn)}
  .g-retry span{flex:1 1 180px}
  .g-grid{columns:2;column-gap:8px}
  @media (min-width:640px){.g-grid{columns:3}} @media (min-width:980px){.g-grid{columns:4}}
  .g-grid button{display:block;width:100%;margin:0 0 8px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--field);break-inside:avoid;cursor:zoom-in}
  .g-grid img{display:block;width:100%;height:auto;min-height:80px}
  .lb{position:fixed;inset:0;z-index:90;background:rgba(8,6,8,.94);display:flex;flex-direction:column;animation:fade .2s}
  .lb-top,.lb-foot{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;color:#F3EADF}
  .lb-foot{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));justify-content:center}
  .lb .icon-btn{color:#F3EADF;background:rgba(255,255,255,.08)}
  .lb .btn{background:rgba(255,255,255,.1);color:#F3EADF}
  .lb-img{flex:1;min-height:0;display:grid;place-items:center;padding:0 10px;touch-action:pan-y}
  .lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lb-meta{flex:1;font-size:13px;color:rgba(243,234,223,.75);text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8C6A2F"/><stop offset=".3" stop-color="#E2C27C"/><stop offset=".5" stop-color="#F5E6B8"/><stop offset=".72" stop-color="#B8914C"/><stop offset="1" stop-color="#9C7637"/></linearGradient><linearGradient id="foilH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8914C" stop-opacity="0"/><stop offset=".5" stop-color="#C9A45C"/><stop offset="1" stop-color="#B8914C" stop-opacity="0"/></linearGradient></defs></svg>
<div class="ambient" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<main class="gw" id="g">
  <section class="g-head glass foil"><span class="eyebrow gold">Photo wall</span><h1 class="display">Opening the <em>gallery</em></h1></section>
</main>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
<input type="file" id="gPick" accept="image/*" multiple hidden>
<script src="/g/gallery.js" defer></script>
</body>
</html>
